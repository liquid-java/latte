name: Java verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Verify and audit upstream compatibility
        working-directory: latte
        run: mvn -B clean verify -Pcompatibility
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: verification-reports
          path: |
            latte/target/surefire-reports/
            latte/target/liquidjava-compatibility.json
